name: Docker Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the application
        run: docker compose up --build --wait --wait-timeout 240

      - name: Verify Apollo Sandbox and GraphQL profile
        run: |
          curl --fail --silent --show-error --header 'Accept: text/html' http://localhost:3000/graphql | grep -qi sandbox
          node --input-type=module <<'NODE'
          const response = await fetch('http://localhost:3000/graphql', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              query: `query {
                profile {
                  name
                  skills { name }
                  experience { company achievements }
                  projects { name url }
                }
              }`,
            }),
          });

          if (!response.ok) {
            throw new Error(`GraphQL returned HTTP ${response.status}`);
          }

          const result = await response.json();
          if (result.errors?.length) {
            throw new Error(JSON.stringify(result.errors));
          }

          const profile = result.data?.profile;
          if (
            profile?.name !== 'Denis Durnov' ||
            profile.skills.length !== 14 ||
            profile.experience.length !== 3 ||
            profile.experience.some((job) => job.achievements.length === 0) ||
            !Array.isArray(profile.projects)
          ) {
            throw new Error(`Unexpected seeded profile: ${JSON.stringify(profile)}`);
          }

          console.log('Apollo Sandbox and seeded nested profile query passed.');
          NODE

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
